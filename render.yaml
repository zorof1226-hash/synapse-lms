services:
  - type: web
    name: synapse-lms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_HOST
        value: 0.0.0.0
      - key: WEB_PORT
        value: 8000
