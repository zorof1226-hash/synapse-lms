name: Automated Study System Daily Sync

on:
  schedule:
    # Runs everyday at 19:00 UTC (customizable to your timezone)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LMS Sync and Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
        run: |
          python main.py sync --lms folder
          python main.py generate

      - name: Commit and Push Updated Database & Markdown Exports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action StudyBot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update study material [skip ci]" && git push)
